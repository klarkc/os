name: NixOS thin client + workstation CI
on:
  workflow_dispatch:
  push:
    paths:
      - "workstations/**"
      - ".github/workflows/build-thin-client.yml"
  pull_request:
    paths:
      - "workstations/**"
      - ".github/workflows/build-thin-client.yml"

concurrency:
  group: nixos-workstations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate NixOS configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Evaluate flake and all NixOS configurations
        run: |
          set -euo pipefail
          cd workstations
          nix flake check --no-build --show-trace
          nix eval --raw .#nixosConfigurations.thin-client.config.networking.hostName
          nix eval --raw .#nixosConfigurations.gcp-workstation.config.networking.hostName
          test "$(nix eval --json .#nixosConfigurations.gcp-workstation.config.security.googleOsLogin.enable)" = true
          test "$(nix eval --json .#nixosConfigurations.gcp-workstation.config.services.openssh.settings.PasswordAuthentication)" = false
          test "$(nix eval --raw .#nixosConfigurations.gcp-workstation.config.services.openssh.settings.PermitRootLogin)" = prohibit-password
          test "$(nix eval --json .#nixosConfigurations.gcp-workstation.config.networking.firewall.interfaces.tailscale0.allowedTCPPorts)" = '[3389]'

  boot-vm:
    name: Boot VMs and verify Ventoy USB state after reboot
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Test client/server and USB persistence in QEMU
        run: |
          set -euo pipefail
          mkdir -p vm-logs
          cd workstations
          nix build -L --max-jobs 1 \
            .#checks.x86_64-linux.boot-and-network-vm \
            .#checks.x86_64-linux.ventoy-usb-persistence-vm \
            2>&1 | tee ../vm-logs/nixos-vm-tests.log
      - name: Upload VM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-vm-failure-logs
          path: vm-logs/
          if-no-files-found: error
          retention-days: 7

  iso:
    name: Build Ventoy ISO
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Build NixOS ISO
        run: |
          set -euo pipefail
          cd workstations
          nix build -L .#thin-client-iso --out-link /tmp/solo-iso
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /tmp/solo-iso/iso/*.iso "$GITHUB_WORKSPACE/dist/"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum *.iso > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: solo-thin-client-iso
          path: dist/
          if-no-files-found: error
          retention-days: 7


  gce-vm:
    name: Test NixOS workstation services in QEMU
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Boot workstation VM and verify access services
        run: |
          set -euo pipefail
          mkdir -p vm-logs
          cd workstations
          nix build -L --max-jobs 1 .#checks.x86_64-linux.gce-workstation-security-vm \
            2>&1 | tee ../vm-logs/nixos-gce-vm-test.log
      - name: Upload workstation VM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-gce-vm-failure-logs
          path: vm-logs/
          if-no-files-found: error
          retention-days: 7

  gce-image:
    name: Build NixOS GCE raw image
    needs: [evaluate, gce-vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Build and checksum NixOS GCE image
        run: |
          set -euo pipefail
          cd workstations
          nix build -L .#gce-image --out-link /tmp/solo-gce-image
          mkdir -p "$GITHUB_WORKSPACE/gce-dist"
          mapfile -t images < <(find -L /tmp/solo-gce-image -maxdepth 1 -type f -name '*.raw.tar.gz' -print)
          test "${#images[@]}" -eq 1
          cp -- "${images[0]}" "$GITHUB_WORKSPACE/gce-dist/"
          (cd "$GITHUB_WORKSPACE/gce-dist" && sha256sum *.raw.tar.gz > SHA256SUMS)
      - name: Upload versioned image (no cloud import)
        uses: actions/upload-artifact@v4
        with:
          name: solo-gce-image-${{ github.sha }}
          path: gce-dist/
          if-no-files-found: error
          retention-days: 7
