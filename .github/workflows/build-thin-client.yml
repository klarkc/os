name: NixOS thin client + workstation CI
on:
  workflow_dispatch:
  push:
    paths:
      - "workstations/**"
      - ".github/workflows/build-thin-client.yml"
  pull_request:
    paths:
      - "workstations/**"
      - ".github/workflows/build-thin-client.yml"

concurrency:
  group: nixos-workstations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate NixOS configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Evaluate flake and all NixOS configurations
        run: |
          set -euo pipefail
          cd workstations
          nix flake check --no-build --show-trace
          nix eval --raw .#nixosConfigurations.thin-client.config.networking.hostName
          nix eval --raw .#nixosConfigurations.gcp-workstation.config.networking.hostName
          test "$(nix eval --raw .#nixosConfigurations.thin-client.config.system.nixos.distroName)" = "Solo Workstation"
          test "$(nix eval --json .#nixosConfigurations.thin-client.config.boot.loader.timeout)" = 1
          nix eval --json .#nixosConfigurations.thin-client.config.boot.kernelParams | jq -e 'index("quiet") != null'
          jq -e '.control | any(.VTOY_LINUX_REMOUNT == "1")' ventoy/ventoy.json
          jq -e '.control | any(.VTOY_SECONDARY_BOOT_MENU == "0")' ventoy/ventoy.json
          test "$(jq -r '.control[] | .VTOY_DEFAULT_IMAGE // empty' ventoy/ventoy.json)" = "/solo-thin-client-x86_64.iso"

  boot-vm:
    name: Boot VMs and verify Ventoy USB state after reboot
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Test client/server and USB persistence in QEMU
        run: |
          set -euo pipefail
          mkdir -p vm-logs
          cd workstations
          nix build -L --max-jobs 1 \
            .#checks.x86_64-linux.boot-and-network-vm \
            .#checks.x86_64-linux.ventoy-usb-persistence-vm \
            2>&1 | tee ../vm-logs/nixos-vm-tests.log
      - name: Upload VM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-vm-failure-logs
          path: vm-logs/
          if-no-files-found: error
          retention-days: 7

  iso:
    name: Build Ventoy ISO
    # Do not publish an untested ISO. VM boot + USB reboot must pass first.
    needs: [evaluate, boot-vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Build NixOS ISO
        run: |
          set -euo pipefail
          cd workstations
          nix build -L .#thin-client-iso --out-link /tmp/solo-iso
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /tmp/solo-iso/iso/*.iso "$GITHUB_WORKSPACE/dist/"
          cp ventoy/ventoy.json "$GITHUB_WORKSPACE/dist/ventoy.json"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum *.iso > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: solo-thin-client-iso
          path: dist/
          if-no-files-found: error
          retention-days: 7
