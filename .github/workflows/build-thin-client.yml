name: Build disposable NixOS thin client
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workstations/**"
      - ".github/workflows/build-thin-client.yml"

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Build ISO
        run: |
          set -euo pipefail
          cd workstations
          nix build --print-build-logs --no-link .#thin-client-iso --out-link /tmp/solo-iso
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /tmp/solo-iso/iso/*.iso "$GITHUB_WORKSPACE/dist/"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum *.iso > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: solo-thin-client-iso
          path: dist/
          if-no-files-found: error
          retention-days: 7
