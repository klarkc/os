name: lpklarkc + GCE workstation CI
on:
  workflow_dispatch:
  push:
    paths:
      - "workstations/**"
      - ".github/workflows/build-thin-client.yml"
  pull_request:
    paths:
      - "workstations/**"
      - ".github/workflows/build-thin-client.yml"

concurrency:
  group: nixos-workstations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate NixOS configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Evaluate flake and all NixOS configurations
        run: |
          set -euo pipefail
          cd workstations
          nix flake check --no-build --show-trace
          test "$(nix eval --raw .#nixosConfigurations.lpklarkc.config.networking.hostName)" = "lpklarkc"
          test "$(nix eval --raw .#nixosConfigurations.lpklarkc.config.isoImage.isoName)" = "lpklarkc-x86_64.iso"
          test "$(nix eval --raw .#nixosConfigurations.lpklarkc.config.image.baseName)" = "lpklarkc-x86_64"
          # Regression: no installer profile, embedded Nixpkgs channel or manual.
          nix eval --json .#nixosConfigurations.lpklarkc.config.system.nixos.variant_id | jq -e '. != "installer"'
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.documentation.enable)" = false
          # No Nix package management or embedded nixpkgs source on live USB.
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.nix.enable)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.nixpkgs.flake.setNixPath)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.nixpkgs.flake.setFlakeRegistry)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.isoImage.makeEfiBootable)" = true
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.isoImage.makeBiosBootable)" = true
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.hardware.enableAllHardware)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.hardware.enableRedistributableFirmware)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.hardware.wirelessRegulatoryDatabase)" = true
          # The RDP kiosk launches rootless Xorg on demand, without a DE.
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.xserver.displayManager.startx.enable)" = true
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.xserver.displayManager.lightdm.enable)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.xserver.windowManager.openbox.enable)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.graphical-desktop.enable)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.speechd.enable)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.pipewire.enable)" = true
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.pipewire.alsa.enable)" = true
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.pipewire.pulse.enable)" = true
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.pipewire.wireplumber.enable)" = true
          nix eval --json .#nixosConfigurations.lpklarkc.config.environment.pathsToLink | jq -e 'index("/share/icons") != null'
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.services.pulseaudio.enable)" = false
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.hardware.graphics.enable)" = false
          # Duplex RDP audio uses PipeWire's PulseAudio protocol shim, not pulseaudio.
          grep -Fq '/sound:sys:pulse /microphone:sys:pulse' scripts/thin-client.sh
          bash tests/iso-size-budget.sh --self-test
          test ! -e ventoy/ventoy.json
          # Catch obsolete identity strings in client-only sources and docs.
          if grep -Eini 's[o]lo' \
            README.md VENTOY-KIOSK.md CLIENT-IAP-GCE-CONTRACT.md flake.nix thin-client.nix \
            scripts/ventoy-state.sh scripts/thin-client.sh scripts/gce-iap.sh tests/ventoy-persistence.nix; then
            echo "Obsolete client identity detected" >&2
            exit 1
          fi
          nix eval --raw .#nixosConfigurations.gcp-workstation.config.networking.hostName
          test "$(nix eval --raw .#nixosConfigurations.lpklarkc.config.system.nixos.distroName)" = "lpklarkc"
          test "$(nix eval --json .#nixosConfigurations.lpklarkc.config.boot.loader.timeout)" = 1
          nix eval --json .#nixosConfigurations.lpklarkc.config.boot.kernelParams | jq -e 'index("quiet") != null'

  boot-vm:
    name: Boot VMs and verify Ventoy USB state after reboot
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Test client/server and USB persistence in QEMU
        run: |
          set -euo pipefail
          mkdir -p vm-logs
          cd workstations
          nix build -L --max-jobs 1 \
            .#checks.x86_64-linux.boot-and-network-vm \
            .#checks.x86_64-linux.ventoy-usb-persistence-vm \
            2>&1 | tee ../vm-logs/nixos-vm-tests.log
      - name: Upload VM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-vm-failure-logs
          path: vm-logs/
          if-no-files-found: error
          retention-days: 7

  iso:
    name: Build Ventoy ISO
    # Do not publish an untested ISO. VM boot + USB reboot must pass first.
    needs: [evaluate, boot-vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Build lpklarkc ISO
        run: |
          set -euo pipefail
          cd workstations
          nix build -L .#lpklarkc-iso --out-link /tmp/lpklarkc-iso
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # NixOS' ISO derivation can use a nixos-minimal-* filename even
          # when isoImage.isoName evaluates to our branded name. Validate
          # exactly one ISO, then give the artifact a stable client identity.
          shopt -s nullglob
          iso_files=(/tmp/lpklarkc-iso/iso/*.iso)
          if [[ "${#iso_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one built ISO; found %s\n' "${#iso_files[@]}" >&2
            exit 1
          fi
          install -m 0644 -- "${iso_files[0]}" "$GITHUB_WORKSPACE/dist/lpklarkc-x86_64.iso"
          test -s "$GITHUB_WORKSPACE/dist/lpklarkc-x86_64.iso"
          # Diagnose the actual closure BEFORE gating, even when over budget.
          echo "Largest Nix store paths in the client runtime closure (bytes):"
          toplevel="$(nix eval --raw .#nixosConfigurations.lpklarkc.config.system.build.toplevel)"
          nix path-info -r --size "$toplevel" | sort -k2nr | sed -n '1,35p'
          # Assert the measured final ISO is at most 1.5 GiB (1536 MiB).
          MAX_ISO_MIB=1536 bash tests/iso-size-budget.sh "$GITHUB_WORKSPACE/dist/lpklarkc-x86_64.iso"
          test ! -e "$GITHUB_WORKSPACE/dist/ventoy.json"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum lpklarkc-x86_64.iso > SHA256SUMS && sha256sum -c SHA256SUMS)
          test "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: lpklarkc-iso
          path: dist/
          if-no-files-found: error
          retention-days: 7
