name: Test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'devenv.lock', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Detect instance changes
        id: instance_changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            diff_range="origin/${{ github.base_ref }}...HEAD"
          else
            diff_range="${{ github.event.before }}...${{ github.sha }}"
          fi
          changed="$(git diff --name-only "$diff_range")"
          if printf '%s\n' "$changed" | rg -q '^devenv\.lock$'; then
            echo "vm_instances=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | rg -q '^modules/shared/system\.nix$'; then
            echo "vm_instances=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          instances=""
          while IFS= read -r instance; do
            instances="${instances}${instance}"$'\n'
          done < <(printf '%s\n' "$changed" | rg -o 'modules/[^/]+/instances/[^/]+\.nix' | sed -E 's#modules/[^/]+/instances/##; s#\.nix##')
          while IFS= read -r instance; do
            instances="${instances}${instance}"$'\n'
          done < <(printf '%s\n' "$changed" | rg -o 'modules/[^/]+/instances/[^/]+\.disko\.nix' | sed -E 's#modules/[^/]+/instances/##; s#\.disko\.nix##')
          while IFS= read -r domain; do
            for path in modules/"$domain"/instances/*.nix; do
              [ -e "$path" ] || continue
              instances="${instances}$(basename "$path" .nix)"$'\n'
            done
          done < <(printf '%s\n' "$changed" | rg -o 'modules/[^/]+/machine\.nix' | sed -E 's#modules/([^/]+)/machine\.nix#\1#')
          instances="$(printf '%s' "$instances" | rg -v '^\s*$' | sort -u || true)"
          if [ -n "$instances" ]; then
            echo "vm_instances=$(printf '%s' "$instances" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          else
            echo "vm_instances=" >> "$GITHUB_OUTPUT"
          fi
      - name: Run devenv tests
        env:
          RUN_VM_INSTANCES: ${{ steps.instance_changes.outputs.vm_instances }}
        run: nix --accept-flake-config run github:cachix/devenv/v2.0.6 -- test
