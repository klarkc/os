name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared policy script
        run: bash workstations/tests/repository-file-policy.sh --selftest
      - name: Verify CI gate contract using offline mocks
        run: bash workstations/tests/test-require-passing-ci.sh
      - name: Hard gate file formats
        run: bash workstations/tests/repository-file-policy.sh --ci
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Build and execute M0 Nix-materialized Shell check
        run: |
          set -euo pipefail
          output="$(nix build --no-link --print-out-paths .#checks.x86_64-linux.m0-shell-materialized)"
          test -s "$output/proof"
          grep -Fx 'nix-m0-materialized:checked' "$output/proof"
          printf 'M0_NIX_MATERIALIZED_CHECK_PASS source=%s output=%s\n' "$GITHUB_SHA" "$output"
          nix hash path "$output"
      - name: Materialize pinned nix-serve-ng Cabal metadata
        run: |
          set -euo pipefail
          output="$(nix build --no-link --print-out-paths .#packages.x86_64-linux.nix-serve-ng-cabal-metadata)"
          test -s "$output/default.nix"
          grep -F 'nix-serve-ng' "$output/default.nix" > /dev/null
          printf 'NIX_SERVE_CABAL_METADATA_MATERIALIZED source=%s output=%s\n' "$GITHUB_SHA" "$output"
          nix hash path "$output"
      - name: Evaluate root and workstation flakes
        run: |
          nix flake check --no-build --show-trace
          (cd workstations && nix flake check --no-build --show-trace)

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Run generic redacted secret scan from Nix devShell
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-findings.json"
          status=0
          nix develop .# --command gitleaks detect --no-git --source . --redact --no-banner --report-format json --report-path "$report" || status=$?
          # Only rule, tracked file and line. Do not print matches, values or findings JSON.
          if [ -s "$report" ]; then
            nix develop .# --command jq -r '.[] | "Rule: \(.RuleID) | File: \(.File) | Line: \(.StartLine)"' "$report"
          fi
          exit "$status"
