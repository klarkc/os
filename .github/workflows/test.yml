name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared policy script
        run: bash workstations/tests/repository-file-policy.sh --selftest
      - name: Hard gate file formats
        run: bash workstations/tests/repository-file-policy.sh --ci
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Evaluate root and workstation flakes
        run: |
          nix flake check --no-build --show-trace
          (cd workstations && nix flake check --no-build --show-trace)

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Run generic redacted secret scan from Nix devShell
        run: nix develop .# --command gitleaks detect --no-git --source . --redact --no-banner
